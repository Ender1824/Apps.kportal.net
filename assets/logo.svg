<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kportal">
  <defs>
    <radialGradient id="kp-bg" cx="30%" cy="15%" r="100%">
      <stop offset="0" stop-color="#1c1e40"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
    <!-- portal rim: violet to cyan -->
    <linearGradient id="kp-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b59cff"/>
      <stop offset="0.5" stop-color="#6f8bff"/>
      <stop offset="1" stop-color="#4fd6ff"/>
    </linearGradient>
    <!-- light rising out of the portal -->
    <radialGradient id="kp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7d8cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7d8cff" stop-opacity="0"/>
    </radialGradient>
    <!-- the K fades as it sinks into the portal -->
    <linearGradient id="kp-fade" gradientUnits="userSpaceOnUse" x1="0" y1="35" x2="0" y2="46">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="kp-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="url(#kp-fade)"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#kp-bg)"/>

  <!-- glow and opening -->
  <ellipse cx="32" cy="44" rx="27" ry="15" fill="url(#kp-glow)"/>
  <ellipse cx="32" cy="45" rx="20" ry="6" fill="#04050b"/>

  <!-- back of the rim, behind the K -->
  <path d="M12 45a20 6 0 0 1 40 0" fill="none" stroke="url(#kp-rim)" stroke-width="2" opacity="0.5"/>

  <!-- K, sinking through -->
  <g fill="#fff" mask="url(#kp-mask)">
    <rect x="19" y="10" width="6.5" height="40" rx="1"/>
    <path d="M25.5 29.2 40.6 10h8.6L25.5 38.6z"/>
    <path d="M29.4 33.2 46.6 52h-8.7L27.4 37.6z"/>
  </g>

  <!-- front of the rim, in front of the K -->
  <path d="M52 45a20 6 0 0 1-40 0" fill="none" stroke="url(#kp-rim)" stroke-width="2.4" stroke-linecap="round"/>
</svg>
